name: Compact routed pulse-width audit (no release)

on:
  push:
    branches: [feature/compact-pio]
    paths:
      - .github/workflows/compact-pulse-audit.yaml
      - tools/compact_pulse_audit.tcl
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  pulse-width:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download frozen successful routing evidence
        uses: actions/download-artifact@v7
        with:
          name: GDS_logs
          run-id: '35385953304'
          github-token: ${{ github.token }}
          path: work/compact-audit/logs
      - name: Download matching submission netlist and parasitics
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
          run-id: '35385953304'
          github-token: ${{ github.token }}
          path: work/compact-audit/submission
      - name: Get unchanged shuttle cell timing libraries
        uses: actions/checkout@v6
        with:
          repository: IHP-GmbH/IHP-Open-PDK
          ref: c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c
          path: work/compact-audit/pdk
          sparse-checkout: ihp-sg13g2/libs.ref/sg13g2_stdcell/lib
          persist-credentials: false
      - name: Verify frozen candidate and run additional timing checks
        run: |
          set -euo pipefail
          echo 'a1dcabf881ddd007d66cd62011873539d04906e3c6f2a8339f759aaf57e35a88  work/compact-audit/submission/tt_submission/tt_um_fabien_pio.v' | sha256sum -c -
          test "$(jq -r .PDK_VERSION work/compact-audit/submission/tt_submission/pdk.json)" = c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c
          mkdir -p work/compact-audit/reports
          docker pull ghcr.io/librelane/librelane:3.0.5
          docker image inspect ghcr.io/librelane/librelane:3.0.5 --format '{{json .RepoDigests}}' | tee work/compact-audit/reports/image-digest.txt
          for corner in fast_1p32V_m40C typ_1p20V_25C slow_1p08V_125C; do
            docker run --rm -v "$PWD:/work" -w /work -e ASTRA_LIB_CORNER="$corner" ghcr.io/librelane/librelane:3.0.5 sta -exit tools/compact_pulse_audit.tcl 2>&1 | tee "work/compact-audit/reports/$corner.log"
            grep -q "ASTRA_PULSE_END $corner" "work/compact-audit/reports/$corner.log"
            grep -q 'slack (MET)' "work/compact-audit/reports/$corner.log"
            if grep -Ei 'VIOLATED|ASTRA_AUDIT_ERROR|^Error:|\[ERROR' "work/compact-audit/reports/$corner.log"; then
              exit 1
            fi
          done
      - name: Preserve full supplemental reports, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compact-pulse-width-audit
          path: work/compact-audit/reports
          if-no-files-found: error
