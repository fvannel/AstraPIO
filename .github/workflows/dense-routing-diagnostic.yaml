name: Dense PIO routing density diagnostic (not a release)
on:
  push:
    branches: [codex/dense-pio10]
    paths: [.github/workflows/dense-routing-diagnostic.yaml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: 01d5d2814fa9dd61e9d211e0b235a4a592a9316a
          path: tt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate unchanged two-tile shuttle configuration
        run: |
          pip install -r tt/requirements.txt librelane==3.0.5
          python tt/tt_tool.py --ihp --create-user-config
      - name: Compare density 91 through global routing with all checks retained
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" ghcr.io/librelane/librelane:3.0.5 python -m librelane --pdk ihp-sg13g2 --run-tag dense-density91 --to OpenROAD.GlobalRouting -c 'PL_TARGET_DENSITY_PCT=91' src/config_merged.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dense-density91-global-route
          path: |
            src/runs/dense-density91
            src/config_merged.json
            src/user_config.json
          if-no-files-found: error
