name: Bounded derated clock-tree drive diagnostic (not a release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        root_buffer: ['sg13g2_buf_4', 'sg13g2_buf_8']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: 01d5d2814fa9dd61e9d211e0b235a4a592a9316a
          path: tt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate unchanged two-tile shuttle configuration
        run: |
          pip install -r tt/requirements.txt librelane==3.0.5
          python tt/tt_tool.py --ihp --create-user-config
      - name: Compare clock-tree root drive under the verified full five percent
        env:
          ROOT_BUFFER: ${{ matrix.root_buffer }}
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" ghcr.io/librelane/librelane:3.0.5 python -m librelane --pdk ihp-sg13g2 --run-tag derated-clock-tree --to OpenROAD.ResizerTimingPostGRT -c "TIME_DERATING_CONSTRAINT=5.0" -c "PL_TARGET_DENSITY_PCT=91" -c "CTS_ROOT_BUFFER=$ROOT_BUFFER" src/config_merged.json
      - name: Verify frozen diagnostic conditions even when placement fails
        if: always()
        env:
          ROOT_BUFFER: ${{ matrix.root_buffer }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path('src/runs/derated-clock-tree')
          config = json.loads((root / 'resolved.json').read_text())
          assert config['PDK_ROOT'].endswith('/c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c')
          assert config['CLOCK_PERIOD'] == 20
          assert config['PL_TARGET_DENSITY_PCT'] == 91
          assert config['CTS_ROOT_BUFFER'] == os.environ['ROOT_BUFFER']
          assert config['CTS_SINK_CLUSTERING_SIZE'] == 25
          assert config['MAX_FANOUT_CONSTRAINT'] == 8
          assert config['TIME_DERATING_CONSTRAINT'] == 5
          assert config['PL_RESIZER_HOLD_SLACK_MARGIN'] == 0.02
          assert config['GRT_RESIZER_HOLD_SLACK_MARGIN'] == 0.08
          assert config['DIE_AREA'] == [0, 0, 202.08, 313.74]
          assert config['GRT_RESIZER_ALLOW_SETUP_VIOS'] is False
          assert config['ERROR_ON_MAGIC_DRC'] is True
          expected = '5.0'
          env_count = 0
          for path in sorted(root.glob('*/_env.tcl')):
              values = re.findall(r'^set ::env\(TIME_DERATING_CONSTRAINT\) (\S+)\s*$', path.read_text(), re.M)
              if values:
                  assert values == [expected], (path, values, expected)
                  env_count += 1
          assert env_count, 'No emitted Tcl derating setting found'
          sdc_count = 0
          # ABC's two-line driving-cell/load file is not an STA constraint deck.
          # Verify every actual OpenROAD-exported STA SDC, not synthesis.abc.sdc.
          for path in sorted(root.glob('*-openroad-*/*.sdc')):
              commands = re.findall(r'^set_timing_derate\s+(.+)$', path.read_text(), re.M)
              factors = {}
              for command in commands:
                  parts = command.split()
                  assert len(parts) == 2 and parts[0] in ('-early', '-late'), (path, command)
                  assert parts[0] not in factors, (path, command)
                  factors[parts[0]] = float(parts[1])
              assert factors == {'-early': 0.95, '-late': 1.05}, (path, factors)
              sdc_count += 1
          assert sdc_count, 'No real tool-exported SDC found'
          print(f'Actual Tcl value {expected} verified in {env_count} tool environments and {sdc_count} exported SDC files.')
          print('Frozen PDK, clock, two-tile boundary, hold target and guards verified. Diagnostic only: no submission artifact or relaxed acceptance criterion.')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: derated-clock-tree-${{ matrix.root_buffer }}
          path: |
            src/runs/derated-clock-tree
            src/config_merged.json
            src/user_config.json
          if-no-files-found: error
