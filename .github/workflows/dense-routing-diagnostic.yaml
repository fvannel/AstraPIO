name: Bounded hold80 placement distribution diagnostic (not a release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        density: ['90', '92']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: 01d5d2814fa9dd61e9d211e0b235a4a592a9316a
          path: tt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate unchanged two-tile shuttle configuration
        run: |
          pip install -r tt/requirements.txt librelane==3.0.5
          python tt/tt_tool.py --ihp --create-user-config
      - name: Compare one placement density with the same hold80 repair target
        env:
          DENSITY: ${{ matrix.density }}
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" ghcr.io/librelane/librelane:3.0.5 python -m librelane --pdk ihp-sg13g2 --run-tag hold-diagnostic --to OpenROAD.ResizerTimingPostGRT -c "PL_TARGET_DENSITY_PCT=$DENSITY" src/config_merged.json
      - name: Verify frozen diagnostic conditions even when placement fails
        if: always()
        env:
          DENSITY: ${{ matrix.density }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('src/runs/hold-diagnostic/resolved.json').read_text())
          assert config['PDK_ROOT'].endswith('/c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c')
          assert config['CLOCK_PERIOD'] == 20
          assert config['PL_TARGET_DENSITY_PCT'] == int(os.environ['DENSITY'])
          assert config['PL_RESIZER_HOLD_SLACK_MARGIN'] == 0.02
          assert config['GRT_RESIZER_HOLD_SLACK_MARGIN'] == 0.08
          assert config['DIE_AREA'] == [0, 0, 202.08, 313.74]
          assert config['GRT_RESIZER_ALLOW_SETUP_VIOS'] is False
          assert config['ERROR_ON_MAGIC_DRC'] is True
          print('Frozen PDK, clock, two-tile boundary, hold target and guards verified. Diagnostic only: no submission artifact.')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hold80-density-${{ matrix.density }}
          path: |
            src/runs/hold-diagnostic
            src/config_merged.json
            src/user_config.json
          if-no-files-found: error
