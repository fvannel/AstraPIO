name: Timed PIO placement feasibility (not a release)
on:
  push:
    branches: [feature/timed-pio]
    paths: [.github/workflows/timed-placement.yaml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  placement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        strategy: [0, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: 01d5d2814fa9dd61e9d211e0b235a4a592a9316a
          path: tt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate the unchanged two-tile shuttle configuration
        run: |
          pip install -r tt/requirements.txt librelane==3.0.5
          python tt/tt_tool.py --ihp --create-user-config
      - name: Attempt placement — all encountered failures remain fatal
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" ghcr.io/librelane/librelane:3.0.5 python -m librelane --pdk ihp-sg13g2 --run-tag timed-place --to OpenROAD.GlobalPlacement -c 'SYNTH_STRATEGY=AREA ${{ matrix.strategy }}' src/config_merged.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timed-placement-area${{ matrix.strategy }}
          path: |
            src/runs/timed-place
            src/config_merged.json
            src/user_config.json
          if-no-files-found: error
