name: Single PIO post-CTS diagnostic (not a release)
on:
  push:
    branches: [feature/single-pio-timed]
    paths: [.github/workflows/single-cts-diagnostic.yaml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The legalizer's default Y search is 100 um, versus a 306 um core.
          # Expand its search only; placement/timing/DRC checks remain fatal.
          - name: root2-density97-y350
            setting: PL_MAX_DISPLACEMENT_Y=350
            second: PL_TARGET_DENSITY_PCT=97
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: 01d5d2814fa9dd61e9d211e0b235a4a592a9316a
          path: tt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate unchanged two-tile shuttle configuration
        run: |
          pip install -r tt/requirements.txt librelane==3.0.5
          python tt/tt_tool.py --ihp --create-user-config
      - name: Replay through post-clock timing repair; one optimization variable only
        env:
          DIAGNOSTIC_SETTING: ${{ matrix.setting }}
          DIAGNOSTIC_SECOND: ${{ matrix.second }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" ghcr.io/librelane/librelane:3.0.5 python -m librelane --pdk ihp-sg13g2 --run-tag single-cts --to OpenROAD.ResizerTimingPostCTS -c 'CTS_ROOT_BUFFER=sg13g2_buf_2' -c "$DIAGNOSTIC_SETTING" -c "$DIAGNOSTIC_SECOND" src/config_merged.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: single-cts-${{ matrix.name }}
          path: |
            src/runs/single-cts
            src/config_merged.json
            src/user_config.json
          if-no-files-found: error
