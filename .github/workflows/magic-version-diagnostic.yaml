name: Magic 10-minute diagnostic (not a release)

on:
  push:
    branches: [diagnostic/sram-magic]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  magic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [new-macro, submitted-gds]
    env:
      PDK_VERSION: 5e6d592e4002946a4616f798c357f0f3c06cf3b6
      ASTRA_MAGIC_VERSION: 8.3.684
      ASTRA_MAGIC_REF: 4f53bb3091d1e4a9b2009a58f157a8a4331d4c84
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Guard against bypasses and false diagnostic passes
        run: |
          python3 -m unittest discover -s test -p test_release_policy.py
          python3 -m unittest discover -s test -p test_sram_diagnostic.py

      - name: Get unmodified pinned Magic sources
        uses: actions/checkout@v6
        with:
          repository: RTimothyEdwards/magic
          ref: ${{ env.ASTRA_MAGIC_REF }}
          path: work/magic-source
          persist-credentials: false

      - name: Download the exact previously submitted artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: '10540429315'
          run-id: '35328977063'
          github-token: ${{ github.token }}
          path: work/magic-comparison/submission

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install identical build dependencies and Ciel PDK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential tcl-dev tk-dev libx11-dev libxext-dev libxt-dev libcairo2-dev libreadline-dev libncurses-dev libglu1-mesa-dev libgl1-mesa-dev flex bison zlib1g-dev time
          python -m pip install 'ciel==2.4.0' 'numpy==1.26.4' 'gdstk==0.9.52'
          python -c 'import gdstk, numpy; print(gdstk.__version__, numpy.__version__)'
          python -m tools.magic_version_diagnostic --help
          ciel enable --pdk-root "$GITHUB_WORKSPACE/work/magic-comparison/pdk" --pdk ihp-sg13g2 "$PDK_VERSION"

      - name: Build Magic without source patches
        working-directory: work/magic-source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/work/magic-build-logs"
          CFLAGS='-O2 -g' ./configure --with-tcl --prefix="$GITHUB_WORKSPACE/work/magic-install" 2>&1 | tee "$GITHUB_WORKSPACE/work/magic-build-logs/configure.log"
          make -j2 2>&1 | tee "$GITHUB_WORKSPACE/work/magic-build-logs/make.log"
          make install 2>&1 | tee "$GITHUB_WORKSPACE/work/magic-build-logs/install.log"
          git diff --exit-code HEAD
          gcc --version
          "$GITHUB_WORKSPACE/work/magic-install/bin/magic" --version

      - name: Run controls and selected layout with a ten-minute limit
        run: |
          python -m tools.magic_version_diagnostic --work work/magic-comparison --binary work/magic-install/bin/magic --source work/magic-source --version "$ASTRA_MAGIC_VERSION" --ref "$ASTRA_MAGIC_REF" --timeout-seconds 600 --target '${{ matrix.target }}'

      - name: Preserve all evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: magic-${{ env.ASTRA_MAGIC_VERSION }}-${{ matrix.target }}-600s-x86_64-${{ github.run_attempt }}
          path: |
            work/magic-comparison/evidence
            work/magic-build-logs
          if-no-files-found: error
          retention-days: 30
