name: gds

on:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enforce explicit remote hardware release gate
        run: python3 tools/require_rtl.py

      - name: Reject provisional DRC bypasses
        run: python3 -m unittest discover -s test -p test_release_policy.py

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26b
        with:
          pdk: ihp-sg13g2
          tools-ref: 01d5d2814fa9dd61e9d211e0b235a4a592a9316a
          librelane-version: '3.0.5'

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26b
        with:
          tools-ref: 01d5d2814fa9dd61e9d211e0b235a4a592a9316a

      - name: Preserve unmodified precheck evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: precheck_evidence
          path: tt/precheck/reports
          if-no-files-found: error

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26b
